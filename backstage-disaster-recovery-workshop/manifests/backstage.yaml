# Backstage itself: a stateless container. Everything it knows is either in its
# config (manifests/app-config.lab.yaml, manifests/catalog/) or in Postgres.
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
spec:
  type: NodePort
  selector:
    app: backstage
  ports:
    - name: http
      port: 7007
      targetPort: http
      # Exposed on localhost:7007 through the kind port mapping in scripts/kind-config.yaml.
      nodePort: 30007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: ${BACKSTAGE_IMAGE}
          # The image's own config, plus the lab's on top. 'args' replaces the image's
          # whole command, so it starts with 'node packages/backend'.
          args:
            - node
            - packages/backend
            - --config
            - app-config.yaml
            - --config
            - app-config.production.yaml
            - --config
            - /config/app-config.lab.yaml
          env:
            # The portal's public URL, written by 'make setup' (see scripts/setup.sh).
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backstage-base-url
                  key: BASE_URL
            - name: POSTGRES_HOST
              value: postgres.backstage.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
          ports:
            - name: http
              containerPort: 7007
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: app-config
              mountPath: /config
              readOnly: true
            - name: catalog
              mountPath: /catalog
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: backstage-app-config
        - name: catalog
          configMap:
            name: backstage-catalog
