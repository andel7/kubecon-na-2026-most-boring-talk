# The seed catalog. It lives in Git and is loaded from config, so Backstage
# re-reads it on every start: it survives losing the database.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Keeps the portal boring
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  profile:
    displayName: Guest
  memberOf: [platform-team]
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: checkout
  description: Everything that takes the customer's money
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: checkout-web
  description: The checkout front end
spec:
  type: website
  lifecycle: production
  owner: platform-team
  system: checkout
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: checkout-api
  description: The checkout API
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: checkout
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cart-service
  description: Keeps track of what is in the cart
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: checkout
