# A tiny web server with one catalog-info.yaml, standing in for "a repository Backstage
# does not have in its config". You register it through the portal in Part 1.
# The file itself is manifests/catalog-files/catalog-info.yaml (mounted from a ConfigMap
# that 'make setup' creates).
apiVersion: v1
kind: Service
metadata:
  name: catalog-files
  namespace: backstage
spec:
  selector:
    app: catalog-files
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-files
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-files
  template:
    metadata:
      labels:
        app: catalog-files
    spec:
      containers:
        - name: nginx
          image: ${NGINX_IMAGE}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /catalog-info.yaml
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: files
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: files
          configMap:
            name: catalog-files
