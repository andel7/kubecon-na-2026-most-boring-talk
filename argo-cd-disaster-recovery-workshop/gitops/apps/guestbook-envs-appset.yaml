# Bonus: an ApplicationSet. You cannot create these in the UI at all,
# so with ClickOps they are usually kubectl-applied from someone's laptop.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-envs
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    # Without this, the ApplicationSet adds a deletion finalizer to every app it creates,
    # and deleting an app would also delete its running workload.
    preserveResourcesOnDeletion: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: prod
  template:
    metadata:
      name: guestbook-{{.env}}
    spec:
      project: default
      source:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        targetRevision: HEAD
        path: helm-guestbook
      destination:
        server: https://kubernetes.default.svc
        namespace: guestbook-{{.env}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
